<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>펫 캠</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #9face6);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .action-bar {
            background-color: #212529;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .action-bar button {
            margin-left: 10px;
        }
        .container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 60px; /* To account for fixed action bar */
        }
        .camera-container {
            background-color: white;
            width: 90%;
            max-width: 800px;
            aspect-ratio: 16/9;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }
        .control-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .btn-record {
            background-color: #dc3545;
            color: white;
        }
        .btn-camera-move {
            background-color: #6a89cc;
            color: white;
        }
    </style>
</head>
<body>
    <!-- 상단 리셋/전원 버튼 -->
    <div class="action-bar">
        <span class="fs-5">🐾 <strong>펫 캠 제어</strong></span>
        <div>
            <button class="btn btn-outline-danger btn-sm">리셋</button>
            <button class="btn btn-outline-secondary btn-sm">전원</button>
        </div>
    </div>

    <div class="container">
        <!-- 카메라 피드 -->
        <div class="camera-container">
            <img id="camera-feed" src="http://라즈베리파이_IP주소:포트번호/video_feed" alt="펫 캠 화면">
        </div>
    </div>

    <!-- 제어 버튼 -->
    <div class="control-section">
        <!-- 녹화 버튼 -->
        <button id="record-btn" class="btn btn-record btn-lg shadow">
            <i class="bi bi-record-circle"></i> 녹화
        </button>

        <!-- 카메라 이동 버튼 -->
        <div>
            <button id="left-btn" class="btn btn-camera-move btn-lg shadow">⬅️</button>
            <button id="right-btn" class="btn btn-camera-move btn-lg shadow">➡️</button>
        </div>
    </div>

    <!-- Bootstrap Icons 및 JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // JavaScript로 버튼 제어
        document.getElementById('record-btn').addEventListener('click', () => {
            alert('녹화를 시작하거나 중지합니다.');
            // 여기에 녹화 시작/중지 로직 추가
        });

        document.getElementById('left-btn').addEventListener('click', () => {
            alert('카메라를 왼쪽으로 이동합니다.');
            // 여기에 카메라 이동 API 요청 추가
        });

        document.getElementById('right-btn').addEventListener('click', () => {
            alert('카메라를 오른쪽으로 이동합니다.');
            // 여기에 카메라 이동 API 요청 추가
        });
    </script>
</body>
</html>

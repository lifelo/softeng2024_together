<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메인 페이지</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #74ebd5, #9face6);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .btn-primary {
      background-color: #6a89cc;
      border: none;
    }
    .btn-primary:hover {
      background-color: #4a69bd;
    }
    a {
      text-decoration: none;
      color: #4a69bd;
    }
    a:hover {
      color: #1e3799;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card p-4" style="max-width: 600px; margin-top: 50px;">
      <div class="card-body">
        <h5 class="card-title text-center mb-4 fw-bold">환영합니다!</h5>
        <p class="text-center mb-4">로그인에 성공하였습니다. 아래 버튼을 클릭하여 메인 페이지로 이동할 수 있습니다.</p>
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-primary btn-lg">대시보드</button>
          <button type="button" class="btn btn-secondary btn-lg">프로필</button>
          <button type="button" class="btn btn-danger btn-lg">로그아웃</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
